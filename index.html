<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - EduFarm</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="login-page">

  <div class="login-container">
    <!-- SISI KIRI: BRANDING (Warna Biru) -->
    <div class="login-brand-section">
      <img src="/assets/images/logo.png" alt="Logo EduFarm" class="login-logo">
      <h1 class="login-title">EduFarm</h1>
      <p class="login-subtitle">Aplikasi Manajemen Peternakan Terpadu untuk Peternak Modern.</p>
    </div>

    <!-- SISI KANAN: FORM LOGIN (Warna Putih) -->
    <div class="login-form-section">
      <div class="login-form-content">
        <h2 style="color: var(--text-main); margin-bottom: 10px; font-size: 28px;">Selamat Datang</h2>
        <p style="color: var(--text-muted); margin-bottom: 40px; font-size: 15px;">Silakan masuk menggunakan akun Google Anda untuk melanjutkan.</p>
        
        <!-- Tombol Google -->
        <div id="google-btn-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/services/LoginService.ts"></script>
</body>
</html>
