<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kesehatan - EduFarm</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>

  <header>
    <div style="display: flex; align-items: center;">
      <img src="/assets/images/logo.png" alt="Logo" class="header-logo">
      <h2>Kesehatan Ternak</h2>
    </div>
  </header>

  <main class="page-container">
    <div class="form-box">
      <form id="form-kesehatan">
        <div class="form-group">
          <label>Pilih Ternak</label>
          <select id="nama-ternak" required>
            <option value="">Memuat data ternak...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Jenis Perawatan / Vaksin</label>
          <input type="text" id="perawatan" placeholder="Contoh: Vaksin PMK" required>
        </div>
        <button type="submit" id="btn-simpan-kes" class="btn">Simpan Catatan</button>
      </form>
    </div>
    
    <h3>Riwayat Kesehatan</h3>
    <div id="list-kesehatan" class="card-list"></div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <span class="material-symbols-rounded">home</span>
      <span>Beranda</span>
    </a>
    <a href="data-ternak.html" class="nav-item">
      <span class="material-symbols-rounded">list_alt</span>
      <span>Ternak</span>
    </a>
    <a href="transaksi.html" class="nav-item">
      <span class="material-symbols-rounded">receipt_long</span>
      <span>Transaksi</span>
    </a>
    <a href="hasil-ternak.html" class="nav-item">
      <span class="material-symbols-rounded">compost</span>
      <span>Produksi</span>
    </a>
    <a href="materi.html" class="nav-item">
      <span class="material-symbols-rounded">menu_book</span>
      <span>Edukasi</span>
    </a>
    <a href="profil.html" class="nav-item">
      <span class="material-symbols-rounded">person</span>
      <span>Profil</span>
    </a>
  </nav>

  <script type="module" src="/src/services/KesehatanService.ts"></script>
</body>
</html>
