<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profil - EduFarm</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>

  <header>
    <div style="display: flex; align-items: center;">
      <img src="/assets/images/logo.png" alt="Logo" class="header-logo">
      <h2>Profil Pengguna</h2>
    </div>
  </header>

  <main class="page-container" style="text-align: center; margin-top: 40px;">
    
    <!-- Kotak Avatar / Inisial -->
    <div style="width: 90px; height: 90px; background-color: var(--primary); color: white; font-size: 36px; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 50%; margin: 0 auto 20px auto; box-shadow: var(--shadow-sm);">
      <span id="prof-inisial">A</span>
    </div>
    
    <h2 id="prof-nama" style="margin-bottom: 5px; color: var(--text-main); font-size: 24px;">Memuat...</h2>
    <p style="color: var(--text-muted); margin-top: 0; font-size: 15px; margin-bottom: 30px;">
      <span id="prof-kandang">-</span>
    </p>
    
    <div class="card" style="text-align: left; margin-bottom: 30px; border-radius: var(--radius-lg);">
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">Akun terhubung dengan:</p>
      <strong style="display: flex; align-items: center; gap: 8px; color: var(--primary);">
        <span class="material-symbols-rounded">verified</span> 
        Google Account
      </strong>
    </div>
    
    <!-- TOMBOL LOGOUT DIPERBAIKI -->
    <button id="btn-logout" class="btn btn-merah">
      Keluar Aplikasi
    </button>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <span class="material-symbols-rounded">home</span>
      <span>Beranda</span>
    </a>
    <a href="data-ternak.html" class="nav-item">
      <span class="material-symbols-rounded">list_alt</span>
      <span>Ternak</span>
    </a>
    <a href="transaksi.html" class="nav-item">
      <span class="material-symbols-rounded">receipt_long</span>
      <span>Transaksi</span>
    </a>
    <a href="hasil-ternak.html" class="nav-item">
      <span class="material-symbols-rounded">compost</span>
      <span>Produksi</span>
    </a>
    <a href="materi.html" class="nav-item">
      <span class="material-symbols-rounded">menu_book</span>
      <span>Edukasi</span>
    </a>
    <a href="profil.html" class="nav-item active">
      <span class="material-symbols-rounded">person</span>
      <span>Profil</span>
    </a>
  </nav>

  <script type="module" src="/src/services/ProfilService.ts"></script>
</body>
</html>
